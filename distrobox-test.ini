# distrobox-test.ini — Lightweight test environment for the 32-bit binary
#
# Usage:
#   distrobox assemble create --file distrobox-test.ini
#   distrobox enter acgc-test
#
#   sudo dnf install -y --repo=fedora mesa-libGL.i686 mesa-libEGL.i686 mesa-dri-drivers.i686
#   sudo dnf install -y gdb  # for debugging
#
#   cd /path/to/ACGC-PC-Port/pc/build32/bin
#   ./AnimalCrossing --verbose
#
# Note: Mesa is installed *after* distrobox creation (not via additional_packages)
# because --repo=fedora is needed to get the stable Mesa 26.0.3 (LLVM 20) — the
# updates repo ships Mesa 26.1.3 which bundles the crashing 32-bit LLVM 22.1.x.

[acgc-test]
image=fedora:43
additional_packages="glibc.i686 libstdc++.i686 libgcc.i686 libatomic.i686 libX11.i686 libXext.i686 libXrandr.i686 libXcursor.i686 libXi.i686 libXinerama.i686 libXxf86vm.i686 alsa-lib.i686 pulseaudio-libs.i686 gdb"
