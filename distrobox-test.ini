# distrobox-test.ini — Lightweight test environment for the 64-bit binary
#
# Usage:
#   distrobox assemble create --file distrobox-test.ini
#   distrobox enter acgc-test
#
#   cd /path/to/ACGC-PC-Port/pc && mkdir -p build && cd build
#   cmake ..
#   make -j$(nproc)
#   cd bin
#   ./AnimalCrossing --verbose
#   gdb --args ./AnimalCrossing --verbose

[acgc-test]
image=fedora:44
additional_packages="gcc gcc-c++ cmake make glibc-devel libstdc++-devel libgcc libatomic libX11-devel libXext-devel libXrandr-devel libXcursor-devel libXi-devel libXinerama-devel libXxf86vm-devel alsa-lib-devel pulseaudio-libs-devel sdl2-compat-devel mesa-libGL-devel mesa-libEGL-devel mesa-dri-drivers curl python3 git gdb"
